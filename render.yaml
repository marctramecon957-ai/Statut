services:
  - type: web
    name: valenca-emploi-du-temps
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
    # ⚠️ Sans disque persistant, les comptes et l'emploi du temps créés
    # depuis l'espace admin restent en place tant que le service tourne,
    # mais sont PERDUS à chaque redéploiement ou redémarrage (le plan Free
    # de Render ne conserve pas le système de fichiers entre deux builds).
    # Pour les garder définitivement, décommente ce bloc (disque payant à
    # partir du plan Starter) ET ajoute la variable DB_PATH=/data/db.json
    # dans l'onglet Environment de Render.
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
